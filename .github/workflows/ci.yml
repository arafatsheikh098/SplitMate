name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: splitmate
          POSTGRES_USER: splitmate
          POSTGRES_PASSWORD: splitmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitmate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://splitmate:splitmate@localhost:5432/splitmate
      SECRET_KEY: ci-secret-do-not-use
      ENV: testing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: python -m ruff check .

      - name: Migrate (up)
        run: python -m alembic upgrade head

      - name: Tests
        run: python -m pytest --maxfail=1

      - name: Migrate (down)
        run: python -m alembic downgrade base