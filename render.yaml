services:
  - type: web
    name: splitmate
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -e '.[dev]'
    startCommand: |
      alembic upgrade head &&
      python -m splitmate.seed &&
      uvicorn splitmate.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: splitmate-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: splitmate-db
    plan: free
    databaseName: splitmate
    user: splitmate
    ipAllowList: []
