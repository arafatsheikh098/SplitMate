services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: splitmate
      POSTGRES_USER: splitmate
      POSTGRES_PASSWORD: splitmate
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitmate"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      ENV: development
      DATABASE_URL: postgresql+psycopg://splitmate:splitmate@db:5432/splitmate
      SECRET_KEY: development-secret-change-me
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  db_data: